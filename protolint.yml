# Protolint configuration file for WipperSnapper
# configuration file reference: https://github.com/yoheimuta/protolint/blob/master/_example/config/.protolint.yaml
---
lint:
  rules:
    all_default: true
    remove:
      - IMPORTS_SORTED
      - FIELDS_HAVE_COMMENT
  rules_option:
    max_line_length:
      max_chars: 150
      tab_chars: 2
