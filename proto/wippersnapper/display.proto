// Display API for Adafruit WipperSnapper

syntax = "proto3";
package ws.display;
import "sensor.proto";

// ============================================================================
// Message Envelopes
// ============================================================================

/**
 * BrokerToDevice message envelope
 */
message B2D {
  oneof payload {
    Add add       = 1;
    Remove remove = 2;
    Write write   = 3;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  oneof payload {
    AddedOrReplaced added_or_replaced = 1;
    Removed removed                   = 2;
  }
}

// ============================================================================
// Enums
// ============================================================================

/**
 * DisplayType determines the type of display
 * and selects which driver should be used.
 */
enum DisplayType {
  DISPLAY_TYPE_UNSPECIFIED = 0; /** Unspecified display type. */
  DISPLAY_TYPE_EPD         = 1; /** EPD (E-Paper Display) type */
  DISPLAY_TYPE_TFT         = 2; /** TFT (Thin Film Transistor) type */
  DISPLAY_TYPE_OLED        = 3; /** OLED (Organic LED) type */
  DISPLAY_TYPE_LED_BACKPACK = 4; /** LED Backpack (HT16K33-based 7-segment/14-segment displays) */
  DISPLAY_TYPE_CHAR_LCD    = 5; /** Character LCD (text-based LCD displays) */
}

/**
 * EPDMode defines the mode of the EPD display.
 * This affects how the display renders images.
 */
enum EPDMode {
  EPD_MODE_UNSPECIFIED = 0; /** Unspecified EPD mode */
  EPD_MODE_GRAYSCALE4  = 1; /** Grayscale 4 EPD mode */
  EPD_MODE_MONO        = 2; /** Monochrome EPD mode */
}

/**
 * LedBackpackAlignment represents text alignment options for LED backpack displays
 */
enum LedBackpackAlignment {
  LBA_UNSPECIFIED = 0; /** Unspecified alignment option. */
  LBA_LEFT        = 1; /** (Default) Left-aligned. */
  LBA_RIGHT       = 2; /** Right-aligned. */
}

/**
 * OledTextSize represents the desired OLED display text 'magnification' size.
 */
enum OledTextSize {
  OTS_UNSPECIFIED = 0; /** Unspecified text size. */
  OTS_DEFAULT     = 1; /** Default text size, 6x8px. */
  OTS_LARGE       = 2; /** Larger text size option, 12x16px. */
}

// ============================================================================
// Configuration Messages
// ============================================================================

/**
 * I2cDisplayConfig contains the I2C bus configuration for I2C-based displays
 * (OLED, LED Backpack, Character LCD)
 * Matches DeviceDescriptor structure from i2c.proto for consistency
 */
message I2cDisplayConfig {
  uint32 device_address = 1; /** I2C device address (typically 0x3C or 0x3D for OLED, 0x70 for HT16K33) */
  string bus_sda        = 2; /** Optional SDA pin for alternate I2C bus */
  string bus_scl        = 3; /** Optional SCL pin for alternate I2C bus */
  uint32 mux_address    = 4; /** Optional I2C multiplexer address */
  uint32 mux_channel    = 5; /** Optional I2C multiplexer channel (0-7) */
}

/**
 * EpdSpiConfig contains the configuration for SPI-based EPD displays.
 * Includes the SPI bus number and pin assignments.
 */
message EpdSpiConfig {
  int32 bus          = 1; /** The SPI bus to use */
  string pin_dc      = 2; /** Pin for data/command */
  string pin_rst     = 3; /** Pin for reset */
  string pin_cs      = 4; /** Pin for chip select */
  string pin_sram_cs = 5; /** Pin for SRAM chip select */
  string pin_busy    = 6; /** Pin for busy signal */
}

/**
 * EPDConfig contains the configuration for an EPD display.
 * It includes the mode, dimensions, and panel type.
 */
message EPDConfig {
  EPDMode mode    = 1; /** The mode of the EPD display */
  int32 width     = 2; /** Width of the EPD display, in pixels */
  int32 height    = 3; /** Height of the EPD display, in pixels */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

/**
 * OledConfig represents the configuration for an OLED display.
 */
message OledConfig {
  uint32 width           = 1; /** Width of the OLED display in pixels. */
  uint32 height          = 2; /** Height of the OLED display in pixels. */
  OledTextSize font_size = 3; /** Desired font magnification for the OLED display. Defaults to OTS_DEFAULT. */
}

/**
 * LedBackpackConfig represents the configuration for a LED backpack display.
 */
message LedBackpackConfig {
  int32 brightness               = 1; /** Desired brightness of the LED backpack, from 0 (off) to 15 (full brightness). */
  LedBackpackAlignment alignment = 2; /** Desired text alignment for the LED backpack. */
}

/**
 * CharLcdConfig represents the configuration for a character LCD display.
 */
message CharLcdConfig {
  uint32 rows    = 1; /** Number of rows for the character LCD. */
  uint32 columns = 2; /** Number of columns for the character LCD. */
}

/**
 * TftSpiConfig contains the configuration for SPI TFT displays.
 * Includes the SPI bus number and pin assignments.
 */
message TftSpiConfig {
  int32 bus       = 1; /** The SPI bus to use */
  string pin_cs   = 2; /** Pin for chip select */
  string pin_dc   = 3; /** Pin for data/command */
  string pin_mosi = 4; /** Pin for MOSI */
  string pin_sck  = 5; /** Pin for SCK */
  string pin_rst  = 6; /** Pin for reset */
  string pin_miso = 7; /** Pin for MISO */
}

message TftConfig {
  int32 width     = 1; /** Width of the TFT display in pixels */
  int32 height    = 2; /** Height of the TFT display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message TtlRgb666PinConfig {
  string pin_r0 = 1; /** Pin for R0 */
  string pin_r1 = 2; /** Pin for R1 */
  string pin_r2 = 3; /** Pin for R2 */
  string pin_g0 = 4; /** Pin for G0 */
  string pin_g1 = 5; /** Pin for G1 */
  string pin_g2 = 6; /** Pin for G2 */
  string pin_b0 = 7; /** Pin for B0 */
  string pin_b1 = 8; /** Pin for B1 */
  string pin_b2 = 9; /** Pin for B2 */
}

message TtlRgb666Config {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message I8080PinConfig {
  string pin_d0  = 1; /** Pin for D0 */
  string pin_d1  = 2; /** Pin for D1 */
  string pin_d2  = 3; /** Pin for D2 */
  string pin_d3  = 4; /** Pin for D3 */
  string pin_d4  = 5; /** Pin for D4 */
  string pin_d5  = 6; /** Pin for D5 */
  string pin_d6  = 7; /** Pin for D6 */
  string pin_d7  = 8; /** Pin for D7 */
  string pin_cs  = 9; /** Pin for chip select */
  string pin_dc  = 10; /** Pin for data/command */
  string pin_rst = 11; /** Pin for reset */
}

message I8080Config {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message DsiPinConfig {
  string pin_clk   = 1; /** Pin for DSI clock */
  string pin_data0 = 2; /** Pin for DSI data lane 0 */
  string pin_data1 = 3; /** Pin for DSI data lane 1 */
  string pin_data2 = 4; /** Pin for DSI data lane 2 */
  string pin_data3 = 5; /** Pin for DSI data lane 3 */
}

message DsiConfig {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

