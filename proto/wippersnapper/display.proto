// Display API for Adafruit WipperSnapper

syntax = "proto3";
package ws.display;
import "sensor.proto";

// ============================================================================
// Enums
// ============================================================================

/**
 * DisplayType determines the type of display
 * and selects which driver should be used.
 */
enum DisplayType {
  DISPLAY_TYPE_UNSPECIFIED = 0; /** Unspecified display type. */
  DISPLAY_TYPE_EPD         = 1; /** EPD display type */
  DISPLAY_TYPE_TFT         = 2; /** TFT display type */
}

/**
 * EPDMode defines the mode of the EPD display.
 * This affects how the display renders images.
 */
enum EPDMode {
  EPD_MODE_UNSPECIFIED = 0; /** Unspecified EPD mode */
  EPD_MODE_GRAYSCALE4  = 1; /** Grayscale 4 EPD mode */
  EPD_MODE_MONO        = 2; /** Monochrome EPD mode */
}

/**
 * DisplayDriver determines the specific driver to use for the display.
 */
enum DisplayDriver {
  DISPLAY_DRIVER_UNSPECIFIED = 0; /** Unspecified display driver */
  DISPLAY_DRIVER_EPD_SSD1680 = 1; /** EPD SSD1680 driver */
  DISPLAY_DRIVER_EPD_ILI0373 = 2; /** EPD SSD167 driver */
  DISPLAY_DRIVER_TFT_ST7789  = 3; /** TFT ST7789 driver */
  DISPLAY_DRIVER_EPD_UC8253  = 4; /** EPD UC8253 driver */
  DISPLAY_DRIVER_EPD_UC8179  = 5; /** EPD UC8179 driver */
  DISPLAY_DRIVER_EPD_UC8151  = 6; /** EPD UC8151 driver */
  DISPLAY_DRIVER_EPD_SSD1683 = 7; /** EPD SSD1683 driver */
}

/*
5.83" Monochrome E-Ink Display (648x480 UC8179) (#6397)
4.2" Grayscale E-Ink Display (300x400 SSD1683) (#6381)
3.7" Monochrome E-Ink Display (416x240 UC8253) (#6395)
2.9" Flexible E-Ink Display (296x128 UC8151 / now ILI0343) (#4262)

Qualia - pick one
Memento?

T-DisplayS3 ("i8080" intel 8-bit parallel bus - rgb565)

P4 pick one
*/

// ============================================================================
// Configuration Messages
// ============================================================================

/**
 * EpdSpiConfig contains the configuration for SPI-based EPD displays.
 * Includes the SPI bus number and pin assignments.
 */
message EpdSpiConfig {
  int32 bus          = 1; /** The SPI bus to use */
  string pin_dc      = 2 [(nanopb).max_size = 6]; /** Pin for data/command */
  string pin_rst     = 3 [(nanopb).max_size = 6]; /** Pin for reset */
  string pin_cs      = 4 [(nanopb).max_size = 6]; /** Pin for chip select */
  string pin_sram_cs = 5 [(nanopb).max_size = 6]; /** Pin for SRAM chip select */
  string pin_busy    = 6 [(nanopb).max_size = 6]; /** Pin for busy signal */
}

/**
 * EPDConfig contains the configuration for an EPD display.
 * It includes the mode, dimensions, and panel type.
 */
message EPDConfig {
  EPDMode mode    = 1; /** The mode of the EPD display */
  int32 width     = 2; /** Width of the EPD display, in pixels */
  int32 height    = 3; /** Height of the EPD display, in pixels */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

/**
 * TftSpiConfig contains the configuration for SPI TFT displays.
 * Includes the SPI bus number and pin assignments.
 */
message TftSpiConfig {
  int32 bus       = 1; /** The SPI bus to use */
  string pin_cs   = 2 [(nanopb).max_size = 6]; /** Pin for chip select */
  string pin_dc   = 3 [(nanopb).max_size = 6]; /** Pin for data/command */
  string pin_mosi = 4 [(nanopb).max_size = 6]; /** Pin for MOSI */
  string pin_sck  = 5 [(nanopb).max_size = 6]; /** Pin for SCK */
  string pin_rst  = 6 [(nanopb).max_size = 6]; /** Pin for reset */
  string pin_miso = 7 [(nanopb).max_size = 6]; /** Pin for MISO */
}

message TftConfig {
  int32 width     = 1; /** Width of the TFT display in pixels */
  int32 height    = 2; /** Height of the TFT display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message TtlRgb666PinConfig {
  string pin_r0 = 1 [(nanopb).max_size = 6]; /** Pin for R0 */
  string pin_r1 = 2 [(nanopb).max_size = 6]; /** Pin for R1 */
  string pin_r2 = 3 [(nanopb).max_size = 6]; /** Pin for R2 */
  string pin_g0 = 4 [(nanopb).max_size = 6]; /** Pin for G0 */
  string pin_g1 = 5 [(nanopb).max_size = 6]; /** Pin for G1 */
  string pin_g2 = 6 [(nanopb).max_size = 6]; /** Pin for G2 */
  string pin_b0 = 7 [(nanopb).max_size = 6]; /** Pin for B0 */
  string pin_b1 = 8 [(nanopb).max_size = 6]; /** Pin for B1 */
  string pin_b2 = 9 [(nanopb).max_size = 6]; /** Pin for B2 */
}

message TtlRgb666Config {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message I8080PinConfig {
  string pin_d0  = 1 [(nanopb).max_size = 6]; /** Pin for D0 */
  string pin_d1  = 2 [(nanopb).max_size = 6]; /** Pin for D1 */
  string pin_d2  = 3 [(nanopb).max_size = 6]; /** Pin for D2 */
  string pin_d3  = 4 [(nanopb).max_size = 6]; /** Pin for D3 */
  string pin_d4  = 5 [(nanopb).max_size = 6]; /** Pin for D4 */
  string pin_d5  = 6 [(nanopb).max_size = 6]; /** Pin for D5 */
  string pin_d6  = 7 [(nanopb).max_size = 6]; /** Pin for D6 */
  string pin_d7  = 8 [(nanopb).max_size = 6]; /** Pin for D7 */
  string pin_cs  = 9 [(nanopb).max_size = 6]; /** Pin for chip select */
  string pin_dc  = 10 [(nanopb).max_size = 6]; /** Pin for data/command */
  string pin_rst = 11 [(nanopb).max_size = 6]; /** Pin for reset */
}

message I8080Config {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

message DsiPinConfig {
  string pin_clk   = 1 [(nanopb).max_size = 6]; /** Pin for DSI clock */
  string pin_data0 = 2 [(nanopb).max_size = 6]; /** Pin for DSI data lane 0 */
  string pin_data1 = 3 [(nanopb).max_size = 6]; /** Pin for DSI data lane 1 */
  string pin_data2 = 4 [(nanopb).max_size = 6]; /** Pin for DSI data lane 2 */
  string pin_data3 = 5 [(nanopb).max_size = 6]; /** Pin for DSI data lane 3 */
}

message DsiConfig {
  int32 width     = 1; /** Width of the display in pixels */
  int32 height    = 2; /** Height of the display in pixels */
  int32 rotation  = 3; /** Rotation of the display (0-3) */
  int32 text_size = 4; /** Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

/*
  TODO:Tyeth: protobuf v2 changes:
  * Consider merging config message types, currently EPDmode + w/h/rot/txtSz
  * Allow brightness pin control / inclusion in pin configs
  * Refactor SPI bus pin info to be sub message Spi
*/

// ============================================================================
// Request Messages
// ============================================================================

/**
 * DisplayAddOrReplace adds a new display or replaces an existing one.
 */
message DisplayAddOrReplace {
  DisplayType type     = 1; /** The type of display */
  DisplayDriver driver = 2; /** The specific driver for the display */
  string name          = 3 [(nanopb).max_size = 64]; /** Identifies the display. */
  oneof interface_type {
    EpdSpiConfig spi_epd          = 4; /** SPI configuration for EPD. */
    TftSpiConfig spi_tft          = 5; /** SPI configuration for TFT. */
    I2cBusConfig i2c              = 6; /** I2C bus configuration. */
    TtlRgb666PinConfig ttl_rgb666 = 7; /** RGB666 configuration for Qualia. */
    I8080PinConfig i8080          = 8; /** i8080 8-bit parallel for T-DisplayS3/Memento. */
    DsiPinConfig dsi              = 9; /** DSI configuration for T-DisplayS3/Memento. */
  }
  oneof config {
    EPDConfig config_epd              = 10; /** Configuration for EPD. */
    TftConfig config_tft              = 11; /** Configuration for TFT. */
    TtlRgb666Config config_ttl_rgb666 = 12; /** Configuration for TTL RGB666. */
    I8080Config config_i8080          = 13; /** Configuration for i8080. */
    DsiConfig config_dsi              = 14; /** Configuration for DSI. */
  }
}

/**
 * DisplayRemove removes an existing display.
 */
message DisplayRemove {
  string name = 1 [(nanopb).max_size = 64]; /** Identifier for the display. */
}

message BinaryImageType {
  string content_type = 1 [(nanopb).max_size = 64]; /** MIME type of the image (e.g., "image/png"). */
  bytes data          = 3 [(nanopb).max_size = 102400]; /** Raw image bytes. */
}

/**
 * DisplayWrite writes content to a display.
 */
message DisplayWrite {
  /** TODO:Tyeth: Is name enough, or do we want to eventually support
  multiple displays with the same name and use additional identifiers?
  */
  string name = 1 [(nanopb).max_size = 64]; /** Identifies the display. */
  oneof content {
    string message               = 2 [(nanopb).max_size = 1024]; /** Monospace text message */
    string url                   = 3 [(nanopb).max_size = 10240]; /** URL to fetch the image from. */
    string base64image           = 4 [(nanopb).max_size = 102400]; /** Base64-encoded w/content-type prefix. */
    BinaryImageType binary_image = 5; /** Binary image data with content type. */
  }
}

// ============================================================================
// Response Messages
// ============================================================================

/**
 * DisplayAddedOrReplaced confirms a display was added or replaced.
 */
message DisplayAddedOrReplaced {
  string name  = 1 [(nanopb).max_size = 64]; /** Identifier for the display. */
  bool did_add = 2; /** Indicates if a display was added */
}

/**
 * DisplayRemoved confirms a display was removed.
 */
message DisplayRemoved {
  string name     = 1 [(nanopb).max_size = 64]; /** Identifies the display. */
  bool did_remove = 2; /** Indicates if a display was removed */
}
