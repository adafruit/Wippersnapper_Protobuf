// Display API for Adafruit WipperSnapper

syntax = "proto3";
package ws.display;
import "i2c.proto";
import "pwm.proto";
import "digitalio.proto";
import "spi.proto";

// ============================================================================
// Message Envelopes
// ============================================================================

/**
 * BrokerToDevice message envelope
 */
message B2D {
  string name        = 1; /** Unique instance identifier for the display. */
  oneof payload {
    Add add       = 2;
    Remove remove = 3;
    Write write   = 4;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  string name        = 1; /** Unique instance identifier for the display. */
  bool did_succeed = 2; /** Indicates if the requested operation succeeded. */
  oneof payload {
    AddedOrReplaced added_or_replaced = 3;
    Removed removed                   = 4;
  }
}

// ============================================================================
// Enums
// ============================================================================

/**
 * DisplayClass determines the type of display
 * and selects which driver should be used.
 */
enum DisplayClass {
  DISPLAY_CLASS_UNSPECIFIED = 0; /** Unspecified display type. */
  DISPLAY_CLASS_EPD         = 1; /** EPD (E-Paper Display) type */
  DISPLAY_CLASS_TFT         = 2; /** TFT (Thin Film Transistor) type */
  DISPLAY_CLASS_OLED        = 3; /** OLED (Organic LED) type */
  DISPLAY_CLASS_LED_BACKPACK = 4; /** LED Backpack (HT16K33-based 7-segment/14-segment displays) */
  DISPLAY_CLASS_CHAR_LCD    = 5; /** Character LCD (text-based LCD displays) */
}

/**
 * EPDMode defines the mode of the EPD display.
 * This affects how the display renders images.
 */
enum EPDMode {
  EPD_MODE_UNSPECIFIED = 0; /** Unspecified EPD mode */
  EPD_MODE_GRAYSCALE4  = 1; /** Grayscale 4 EPD mode */
  EPD_MODE_MONO        = 2; /** Monochrome EPD mode */
}

/**
 * LedBackpackAlignment represents text alignment options for LED backpack displays
 */
enum LedBackpackAlignment {
  LBA_UNSPECIFIED = 0; /** Unspecified alignment option. */
  LBA_LEFT        = 1; /** (Default) Left-aligned. */
  LBA_RIGHT       = 2; /** Right-aligned. */
}

