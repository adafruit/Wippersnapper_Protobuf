// ============================================================================
// Configuration Messages
// ============================================================================

message DisplayProperties {
  int32 width  = 1; /** Display width in pixels. */
  int32 height = 2; /** Display height in pixels. */
  int32 rotation = 3; /** Display rotation (Clockwise 90* increments 0-3). */
  int32 text_size = 4; /** Text size or magnification factor (if applicable) - 1 = 6x8px, 2 = 12x16px, ... */
}

/**
* EpdSpiConfig contains the configuration for SPI-based EPD displays.
* Includes the SPI device config plus display-specific pins.
*/
message EpdSpiConfig {
  ws.spi.DeviceConfig spi = 1; /** SPI bus and pin configuration for EPD. */
  string pin_dc       = 2; /** Pin for data/command */
  string pin_rst      = 3; /** Pin for reset */
  string pin_sram_cs  = 4; /** Pin for SRAM chip select (if required by the EPD). */
  string pin_busy     = 5; /** Pin for busy signal */
}

/**
 * EPDConfig contains the configuration for an EPD display.
 * It includes the mode, dimensions, and panel type.
 */
message EPDConfig {
  EPDMode mode    = 1; /** The mode of the EPD display */
  DisplayProperties properties = 2; /** Common display properties (dimensions, rotation, text size). */
  /** Text Size is a Scale factor for text (1 = 6x8px, 2 = 12x16px,...) */
}

/**
 * LedBackpackConfig represents the configuration for a LED backpack display.
 */
message LedBackpackConfig {
  int32 brightness               = 1; /** Desired brightness of the LED backpack, from 0 (off) to 15 (full brightness). */
  LedBackpackAlignment alignment = 2; /** Desired text alignment for the LED backpack. */
}

/**
 * CharLcdConfig represents the configuration for a character LCD display.
 */
message CharLcdConfig {
  uint32 rows    = 1; /** Number of rows for the character LCD. */
  uint32 columns = 2; /** Number of columns for the character LCD. */
}

/**
 * TftSpiConfig contains the configuration for SPI TFT displays.
 * Includes the SPI device config plus display-specific pins.
 */
message TftSpiConfig {
  ws.spi.DeviceConfig spi = 1; /** SPI bus and pin configuration for TFT. */
  string pin_dc  = 2; /** Pin for data/command */
  string pin_rst = 3; /** Pin for reset */
}

/** TTL RGB666 pin configuration for parallel RGB displays. */
message TtlRgb666PinConfig {
  string pin_r0 = 1; /** Pin for R0 */
  string pin_r1 = 2; /** Pin for R1 */
  string pin_r2 = 3; /** Pin for R2 */
  string pin_g0 = 4; /** Pin for G0 */
  string pin_g1 = 5; /** Pin for G1 */
  string pin_g2 = 6; /** Pin for G2 */
  string pin_b0 = 7; /** Pin for B0 */
  string pin_b1 = 8; /** Pin for B1 */
  string pin_b2 = 9; /** Pin for B2 */
}

/** Intel 8080 8-bit parallel pin configuration for displays. */
message I8080PinConfig {
  string pin_d0  = 1; /** Pin for D0 */
  string pin_d1  = 2; /** Pin for D1 */
  string pin_d2  = 3; /** Pin for D2 */
  string pin_d3  = 4; /** Pin for D3 */
  string pin_d4  = 5; /** Pin for D4 */
  string pin_d5  = 6; /** Pin for D5 */
  string pin_d6  = 7; /** Pin for D6 */
  string pin_d7  = 8; /** Pin for D7 */
  string pin_cs  = 9; /** Pin for chip select */
  string pin_dc  = 10; /** Pin for data/command */
  string pin_rst = 11; /** Pin for reset */
}

/**
 * DsiInterfaceConfig contains the minimal configuration for MIPI DSI displays.
 * DSI clock and data lanes are dedicated differential pads on the SoC, not GPIOs.
 */
message DsiInterfaceConfig {
  uint32 bus      = 1; /** DSI bus index (0 if only one DSI peripheral). */
  string pin_rst  = 2; /** GPIO pin for display panel reset. */
}

/**
 * BacklightConfig configures the display backlight.
 * Shared across any display type with a controllable backlight
 * (TFT, DSI, Character LCD with RGB backlight, etc.).
 */
message BacklightConfig {
  oneof backlight_add {
    ws.digitalio.Add backlight_digital = 1; /** Optional digital pin configuration for backlight control, used during check-in. */
    ws.pwm.Add backlight_pwm           = 2; /** Optional PWM configuration for backlight control, used during check-in. */
  }
   // comes via DigitalIO.Add.Write
}


// ============================================================================
// Request Messages
// ============================================================================

/**
 * Add adds a new display or replaces an existing one.
 * Used as ws.display.Add in i2c.proto for I2C-based displays.
 *
 * Known driver strings (migrated from DisplayDriver enum):
 * EPD drivers: "SSD1680", "ILI0373", "UC8253", "UC8179", "UC8151", "SSD1683"
 * TFT drivers: "ST7789"
 * OLED drivers: "SSD1306", "SSD1305", "SH1106", "SH1107"
 * LED Backpack drivers: "HT16K33"
 * Character LCD drivers: "MCP23008", "PCF8574"
 *
 * Panel naming conventions (for E-Paper displays with same driver, different panels):
 * Format: "{size}-{resolution}-{color_mode}" or "adafruit-{product_id}"
 * Examples: "5.83-648x480-mono", "4.2-300x400-gray", "adafruit-6397"

 To shorten the component names, Brent and I discussed using sub folders for class/driver/resolution, then maybe colour/panel type, but not clear cut.
 displays/oled/ssd1306/
 displays/epd/ssd1680/250x122/mono/    [2.13" e-ink featherwing which has a panel variant with the same driver and no distinguishing features rev2024]
 */
message Add {
  DisplayClass type   = 1; /** The type of display */
  string driver      = 2; /** Driver name (e.g., "UC8179", "SSD1306", "HT16K33") */
  string panel       = 3; /** Panel identifier for same driver with different configs */
  oneof interface_type {
    EpdSpiConfig spi_epd          = 5; /** SPI configuration for EPD. */
    TftSpiConfig spi_tft          = 6; /** SPI configuration for TFT. */
    ws.i2c.DeviceDescriptor i2c   = 7; /** I2C configuration for OLED/LED/LCD displays. */
    TtlRgb666PinConfig ttl_rgb666 = 8; /** RGB666 configuration for Qualia. */
    I8080PinConfig i8080          = 9; /** i8080 8-bit parallel for T-DisplayS3/Memento. */
    DsiInterfaceConfig dsi        = 10; /** DSI configuration for MIPI DSI displays (e.g., ESP32-P4). */
  }
  oneof config {
    EPDConfig config_epd              = 11; /** Configuration for EPD. */
    LedBackpackConfig config_led      = 14; /** Configuration for LED Backpack. */
    CharLcdConfig config_char_lcd     = 15; /** Configuration for Character LCD. */
    DisplayProperties config_display  = 18; /** Configuration for Generic display (w/h/r/txtSz). */
  }
  Write write             = 19; /** Optional initial write for a display, used during check-in. */
  BacklightConfig backlight = 20; /** Optional backlight configuration (shared across display types). */
}

/**
 * Remove removes an existing display.
 */
message Remove {
}

/**
 * Write writes content to a display.
 */
message Write {
  string message = 1; /** Monospace text message */
}

// ============================================================================
// Response Messages
// ============================================================================

/**
 * AddedOrReplaced confirms a display was added or replaced.
 */
message AddedOrReplaced {
}

/**
 * Removed confirms a display was removed.
 */
message Removed {
}
