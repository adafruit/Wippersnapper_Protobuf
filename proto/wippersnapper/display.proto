// ============================================================================
// Request Messages
// ============================================================================

/**
 * Add adds a new display or replaces an existing one.
 * Used as ws.display.Add in i2c.proto for I2C-based displays.
 *
 * Known driver strings (migrated from DisplayDriver enum):
 * EPD drivers: "SSD1680", "ILI0373", "UC8253", "UC8179", "UC8151", "SSD1683"
 * TFT drivers: "ST7789"
 * OLED drivers: "SSD1306", "SSD1305", "SH1106", "SH1107"
 * LED Backpack drivers: "HT16K33"
 * Character LCD drivers: "MCP23008", "PCF8574"
 *
 * Panel naming conventions (for E-Paper displays with same driver, different panels):
 * Format: "{size}-{resolution}-{color_mode}" or "adafruit-{product_id}"
 * Examples: "5.83-648x480-mono", "4.2-300x400-gray", "adafruit-6397"
 */
message Add {
  DisplayType type   = 1; /** The type of display */
  string driver      = 2; /** Driver name (e.g., "UC8179", "SSD1306", "HT16K33") */
  string panel       = 3; /** Panel identifier for same driver with different configs */
  string name        = 4; /** Instance identifier for the display. */
  oneof interface_type {
    EpdSpiConfig spi_epd          = 5; /** SPI configuration for EPD. */
    TftSpiConfig spi_tft          = 6; /** SPI configuration for TFT. */
    I2cDisplayConfig i2c          = 7; /** I2C configuration for OLED/LED/LCD displays. */
    TtlRgb666PinConfig ttl_rgb666 = 8; /** RGB666 configuration for Qualia. */
    I8080PinConfig i8080          = 9; /** i8080 8-bit parallel for T-DisplayS3/Memento. */
    DsiPinConfig dsi              = 10; /** DSI configuration for T-DisplayS3/Memento. */
  }
  oneof config {
    EPDConfig config_epd              = 11; /** Configuration for EPD. */
    TftConfig config_tft              = 12; /** Configuration for TFT. */
    OledConfig config_oled            = 13; /** Configuration for OLED. */
    LedBackpackConfig config_led      = 14; /** Configuration for LED Backpack. */
    CharLcdConfig config_char_lcd     = 15; /** Configuration for Character LCD. */
    TtlRgb666Config config_ttl_rgb666 = 16; /** Configuration for TTL RGB666. */
    I8080Config config_i8080          = 17; /** Configuration for i8080. */
    DsiConfig config_dsi              = 18; /** Configuration for DSI. */
  }
}

/**
 * Remove removes an existing display.
 */
message Remove {
  string name = 1; /** Identifier for the display. */
}

message BinaryImageType {
  string content_type = 1; /** MIME type of the image (e.g., "image/png"). */
  bytes data          = 2; /** Raw image bytes. */
}

/**
 * Write writes content to a display.
 */
message Write {
  string name = 1; /** Identifies the display. */
  oneof content {
    string message               = 2; /** Monospace text message */
    string url                   = 3; /** URL to fetch the image from. */
    string base64image           = 4; /** Base64-encoded w/content-type prefix. */
    BinaryImageType binary_image = 5; /** Binary image data with content type. */
  }

  // Display-specific write options (optional, with defaults)
  bool clear_first = 6; /** Clear display before writing. Default: true */
  int32 cursor_x   = 7; /** Cursor position X (for char LCD/OLED). Default: 0 */
  int32 cursor_y   = 8; /** Cursor position Y (for char LCD/OLED). Default: 0 */
}

// ============================================================================
// Response Messages
// ============================================================================

/**
 * AddedOrReplaced confirms a display was added or replaced.
 */
message AddedOrReplaced {
  string name  = 1; /** Identifier for the display. */
  bool did_add = 2; /** Indicates if a display was added */
}

/**
 * Removed confirms a display was removed.
 */
message Removed {
  string name     = 1; /** Identifies the display. */
  bool did_remove = 2; /** Indicates if a display was removed */
}
