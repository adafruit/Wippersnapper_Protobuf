syntax = "proto3";
package wippersnapper.analogio;
import "sensor.proto";

/**
 * BrokerToDevice message envelope
 */
message B2D {
  oneof payload {
    Add add       = 10;
    Remove remove = 11;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  oneof payload {
    Event event = 10;
  }
}

/**
* Add adds an analog pin to the device.
*/
message Add {
  string pin_name                     = 1; /** Name of the pin. */
  float period                        = 2; /** Time between reads, in seconds. */
  wippersnapper.sensor.Type read_mode = 3; /** Desired read mode for the pin. */
}

/**
* Remove removes an analog pin from the device.
*/
message Remove {
  string pin_name = 1; /** Name of the pin. */
}


/**
* Event is contains a value, sent when an analog pin is read.
*/
message Event {
  string pin_name                   = 1; /** Name of the pin. */
  wippersnapper.sensor.Event event  = 2; /** Reading(s) from an analog pin. */
}
