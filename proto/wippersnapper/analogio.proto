syntax = "proto3";
package ws.analogio;
import "sensor.proto";

/**
 * BrokerToDevice message envelope
 */
message B2D {
  oneof payload {
    Add add       = 1;
    Remove remove = 2;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  oneof payload {
    Event event = 1;
  }
}

/**
* Add adds an analog pin to the device.
*/
message Add {
  string pin_name          = 1; /** Name of the pin. */
  float period             = 2; /** Time between reads, in seconds. */
  ws.sensor.Type read_mode = 3; /** Desired read mode for the pin. */
}

/**
* Remove removes an analog pin from the device.
*/
message Remove {
  string pin_name = 1; /** Name of the pin. */
}


/**
* Event is contains a value, sent when an analog pin is read.
*/
message Event {
  string pin_name                   = 1; /** Name of the pin. */
  ws.sensor.Event value = 2; /** Reading(s) from an analog pin. */
}
