// Addressable Pixels API for Adafruit WipperSnapper
syntax = "proto3";
package ws.pixels;

/**
 * BrokerToDevice message envelope
 */
message B2D {
  oneof payload {
    Add add       = 1;
    Remove remove = 2;
    Write write   = 3;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  oneof payload {
    Added added = 1;
  }
}

/**
* Type defines the type/model of pixel strand.
*/
enum Type {
  T_UNSPECIFIED = 0; /** Unspecified pixel type, error. */
  T_NEOPIXEL    = 1; /** NeoPixel pixel strand. */
  T_DOTSTAR     = 2; /** DotStar pixel strand. */
}

/**
* Order defines the color ordering.
*/
enum Order {
  O_UNSPECIFIED = 0; /** Unspecified color ordering, error. */
  O_GRB         = 1; /** DEFAULT for NeoPixels - Green, Red, Blue */
  O_GRBW        = 2; /** Green, Red, Blue, White */
  O_RGB         = 3; /** Red, Green, Blue */
  O_RGBW        = 4; /** Red, Green, Blue, White */
  O_BRG         = 5; /** DEFAULT for DotStars - Blue, Red, Green */
  O_RBG         = 6; /** Red, Blue Green */
  O_GBR         = 7; /** Green, Blue, Red */
  O_BGR         = 8; /** Blue, Green, Red */
}

/**
* Add represents a call from IO to a device.
* Adds a strand of addressable pixels.
* Initial brightness is always 128.
*/
message Add {
  Type type                = 1; /** Defines the model/type of pixel strand */
  uint32 num               = 2; /** Number of pixels attached to strand. */
  Order ordering           = 3; /** Defines the pixel strand's color ordering. */
  uint32 brightness        = 4; /** Strand brightness, 0 to 255 */
  string pin_data          = 5; /** Data pin a NeoPixel or DotStar strand is connected to. */
  string pin_dotstar_clock = 6; /** Clock pin a DotStar strand is connected to. */
}

/**
* Added represents response from a WipperSnapper
* device to IO after a Add call
*/
message Added {
  bool is_success = 1; /** True if the strand initialized successfully, False otherwise. */
  string pin_data = 2; /** Data pin the responding strand is connected to. */
}

/**
* PixelAdd represents a call from IO to a device
* Removes a strand of addressable pixels and release the resources and pin.
*/
message Remove {
  string pin_data = 1; /** Data pin the pixel strand is connected to. */
}

/**
* Write represents a call from IO to a device.
* Writes to a strand of pixels.
*/
message Write {
  string pin_data = 1; /** Data pin a strand is connected to. */
  uint32 color    = 2; /** 32-bit color value. Most significant byte is white (for RGBW pixels) or ignored (for RGB pixels),
                          next is red, then green, and least significant byte is blue. */
}
