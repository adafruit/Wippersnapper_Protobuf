syntax = "proto3";
package ws.deviceStats;

/**
 * DeviceToBroker message envelope.
 * Periodic device statistics reported back to the broker (link quality, latency, etc.).
 */
message D2B {
  sint32 rssi       = 1; /** WiFi signal strength (RSSI), in dBm. Negative; typically -30 (strong) to -90 (weak). Unset (0) for non-WiFi devices. */
  uint32 latency_ms = 2; /** Round-trip ping latency to the broker, in ms. Reported by non-WiFi devices (e.g. WS Python) that have no RSSI. */
}
