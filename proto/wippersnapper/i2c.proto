syntax = "proto3";
package ws.i2c;
import "sensor.proto";

/**
 * BrokerToDevice message envelope
 */
message B2D {
  oneof payload {
    Probe probe                           = 1;
    DeviceAddOrReplace device_add_replace = 2;
    DeviceRemove device_remove            = 3;
  }
}

/**
 * DeviceToBroker message envelope
 */
message D2B {
  oneof payload {
    Probed probed                               = 1;
    DeviceAddedOrReplaced device_added_replaced = 2;
    DeviceRemoved device_removed                = 3;
    DeviceEvent device_event                    = 4;
  }
}

/**
* BusStatus represents the status of a board's I2C bus
*/
enum BusStatus {
  BS_UNSPECIFIED           = 0; /** Unspecified error occurred. **/
  BS_SUCCESS               = 1; /** I2C bus successfully initialized. **/
  BS_ERROR_HANG            = 2; /** I2C Bus hang, user should reset their board if this persists. **/
  BS_ERROR_PULLUPS         = 3; /** I2C bus failed to initialize - SDA or SCL needs a pull up. **/
  BS_ERROR_WIRING          = 4; /** I2C bus failed to communicate - Please check your wiring. **/
  BS_ERROR_INVALID_CHANNEL = 5; /** I2C MUX failed - Output channel must be within range 0-7. **/
}

/**
* DeviceStatus represents the state of an I2C device/peripheral
*/
enum DeviceStatus {
  DS_UNSPECIFIED             = 0; /** Unspecified error occurred. **/
  DS_SUCCESS                 = 1; /** I2C device successfully initialized. **/
  DS_FAIL_INIT               = 2; /** I2C device failed to initialize. **/
  DS_FAIL_DEINIT             = 3; /** I2C device failed to deinitialize. **/
  DS_FAIL_UNSUPPORTED_SENSOR = 4; /** WipperSnapper version is outdated and does not include this device. **/
  DS_NOT_FOUND               = 5; /** I2C device not found on the bus. **/
}
/**
 * Represents a separate I2C address space, either a Bus or a Mux.
 * - when describing a bus, specify only the scl and sda pins
 * - when describing a single mux channel, specify all fields
 * - when describing an entire mux (all channels), leave mux_channel blank
 */
message AddressSpace {
  uint32 pin_scl        = 1; /** Pin name for the I2C SCL line **/
  uint32 pin_sda        = 2; /** Pin name for the I2C SDA line **/
  uint32 mux_address    = 3; /** Optional - I2C multiplexer address. **/
  uint32 mux_channel    = 4; /** Optional - I2C multiplexer channel, or blank for "all channels" **/
}

/**
 * Request an I2C probe of one or more address spaces, optionally narrowing the
 * scope of the probe to particular addresses.
 * - a v1-style Scan would contain a single AddressSpace and no Address narrowing (scan all 112)
 * - a v2-style Probe would contain every AddressSpace and a ist of specific Addresses to probe for
 */
message Probe {
  repeated AddressSpace address_spaces = 1; /** One or more AddressSpaces, with no mux_channels **/
  repeated uint32 addresses            = 2; /** Optional - Specific addresses to probe on each AddressSpace. Empty means "all address". **/
}

/**
 * The results of scanning a particular AddressSpace.
 * - success with found addresses populates the found_addresses list
 * - an error populates the relevant bus_status and contains no found_addresses
 */
message AddressSpaceResult {
  AddressSpace address_space       = 1; /** Which AddressSpace was probed **/
  BusStatus bus_status             = 2; /** BS_SUCCESS on success, anything else denotes an error on this AddressSpace **/
  repeated uint32 found_addresses  = 3; /** List of I2C addresses where a device was detected, empty in case of error **/
}

/**
 * Response from a Probe request, with results for every AddressSpace that either:
 * - found 1 or more addresses
 * - had an error
 * (Successful probes that did not find anything do not need to be returned.)
 */
message Probed {
  repeated AddressSpaceResult results = 1; /** A success or error result for each AddressSpace probed **/
}

/**
* DeviceDescriptor represents a specific device's I2C address within an address space.
*/
message DeviceDescriptor {
  AddressSpace address_space = 1; /** Which address space this device lives in, with mux_channel required. **/
  uint32 address             = 2; /** Device's i2c address, either on the bus or the mux **/
}

/**
* DeviceAddOrReplace is a message for initializing (or replacing/updating) an i2c device.
*/
message DeviceAddOrReplace {
  DeviceDescriptor device_description             = 1; /** The I2c device's address and metadata. */
  /** The I2c device's name, MUST MATCH the name on the JSON
   *  definition file on the Wippersnapper_Components repo. */
  string device_name                              = 2;
  float device_period                             = 3; /** The desired period to update the I2c device's sensor(s), in seconds. */
  map<uint32, ws.sensor.Type> device_sensor_types = 4; /** SI Types for each sensor on the I2c device. */
}

/**
* DeviceAddedOrReplaced contains the response from a device after processing a DeviceAddOrReplace message.
*/
message DeviceAddedOrReplaced {
  DeviceDescriptor device_description = 1; /** The I2c device's address and metadata, unless there was an error. **/
  BusStatus bus_status                = 2; /** The I2c bus' status, in case of bus error. **/
  DeviceStatus device_status          = 3; /** The I2c device's status, in case of device error. **/
}

/**
* DeviceRemove represents a request to de-init an i2c device.
*/
message DeviceRemove {
  DeviceDescriptor device_description = 1; /** The I2c device's address and metadata. */
}

/**
* DeviceRemoved represents a response to a I2cDeviceRemove message.
*/
message DeviceRemoved {
  DeviceDescriptor device_description = 1; /** The I2c device's address and metadata. */
  bool did_remove                     = 2; /** True if the I2C device was successfully removed from the controller, False otherwise. **/
}

/**
* Each DeviceEvent represents data from **one** I2C device, containing one or more sensors.
*/
message DeviceEvent {
  DeviceDescriptor device_description        = 1; /** The I2c device's address and metadata. */
  map<uint32, ws.sensor.Event> device_events = 2; /** An event from each of the device's configured sensors. */
}

