name: Generate .proto Wrapper Files
on:
  push:
    branches: master
  workflow_dispatch:
    inputs:
      sync_arduino:
        description: Open a PR on adafruit/Adafruit_Wippersnapper_Arduino
        type: boolean
        default: true
      sync_io_node:
        description: Open a PR on AdafruitInternalDev/io-node
        type: boolean
        default: true
      publish_docs:
        description: Deploy HTML docs to GitHub Pages (master only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Build every wrapper once; the jobs below only publish the artifacts, so a
  # bad IO_BOT_PAT can't stop the docs deploy (or the other downstream PR).
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Self Checkout
      uses: actions/checkout@v4
      with:
        path: protobuf-checkout
        submodules: true
    # Same toolchain as build.yml (versions pinned in .tool-versions).
    # protoc 3.13 generated a nanopb_pb2.py that current python-protobuf
    # can't load ("nanopb_fileopt" is missing a containing_type).
    # mise shims resolve versions from the cwd, and later steps run from
    # the workspace root, so the pins need to live there too.
    - name: Use repo tool versions
      run: cp protobuf-checkout/.tool-versions .
    - name: Tool Dependencies
      uses: jdx/mise-action@v2
    - name: Install Python dependencies
      run: pip install protobuf
    - name: Env Debug Info
      run: |
        protoc --version
        which protoc-gen-js
        python --version
        pip list

    # Arduino wrappers for the microcontrollers, plus HTML docs
    - name: Generate Arduino files from .proto Files
      run: |
        mkdir ./arduino_out
        mkdir ./doc
        echo "Installing protobuf-gen-doc"
        go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
        cp ~/go/bin/protoc-gen-doc .
        echo "Generating docs..."
        protoc --plugin=protobuf-checkout/nanopb/generator/protoc-gen-nanopb -Iprotobuf-checkout/nanopb/generator/proto --proto_path=./protobuf-checkout/proto ./protobuf-checkout/proto/wippersnapper/*/*/*.proto --nanopb_out=./arduino_out --nanopb_opt=-I./protobuf-checkout/proto --nanopb_opt=-t --plugin=protoc-gen-doc=./protoc-gen-doc --doc_out=./doc --doc_opt=html,index.html
        # Local (non-CI) build command:
        # protoc --plugin=nanopb/generator/protoc-gen-nanopb -Inanopb/generator/proto --proto_path=./proto ./proto/wippersnapper/*/*/*.proto --nanopb_out=./arduino_out --nanopb_opt=-I./proto --nanopb_opt=-t --plugin=protoc-gen-doc=./protoc-gen-doc --doc_out=./doc --doc_opt=html,index.html

    # NodeJS wrappers for the mqtt broker
    - name: Generate JS Wrapper Files from .proto Files
      run: |
        mkdir ./js_out
        protoc --proto_path=./protobuf-checkout/proto ./protobuf-checkout/proto/wippersnapper/*/*/*.proto --plugin=$(which protoc-gen-js) --js_out=import_style=commonjs,binary:js_out
        protoc ./protobuf-checkout/nanopb/generator/proto/nanopb.proto --plugin=$(which protoc-gen-js) --js_out=import_style=commonjs,binary:js_out

    - uses: actions/upload-artifact@v4
      with:
        name: arduino-wrapper
        path: ./arduino_out
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: javascript-wrapper
        path: ./js_out
        if-no-files-found: error
    # Pages is configured to deploy from this workflow, not from the gh-pages
    # branch, so the artifact is all that's needed.
    - uses: actions/upload-pages-artifact@v3
      with:
        path: ./doc

  docs:
    needs: generate
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish_docs)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  arduino:
    needs: generate
    if: github.event_name == 'push' || inputs.sync_arduino
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IO_BOT_PAT }}
      REPO: adafruit/Adafruit_Wippersnapper_Arduino
      BRANCH: protobuf-update-${{ github.sha }}
    steps:
    - name: Check IO_BOT_PAT
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::IO_BOT_PAT secret is not set"; exit 1
        fi
        if ! gh api "repos/$REPO" --jq .full_name; then
          echo "::error::IO_BOT_PAT was rejected or can't see $REPO - it has probably expired, rotate it in the repo's Actions secrets"
          exit 1
        fi
    - name: Checkout Arduino Repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.REPO }}
        token: ${{ secrets.IO_BOT_PAT }}
        path: arduino-checkout
    - uses: actions/download-artifact@v4
      with:
        name: arduino-wrapper
        path: ./arduino_out
    - name: Copy Generated Arduino Files to Arduino Repo
      run: |
        rm -rf ./arduino-checkout/src/wippersnapper/
        mkdir ./arduino-checkout/src/wippersnapper/
        cp -a ./arduino_out/. ./arduino-checkout/src/
    - name: Open Arduino Pull Request
      working-directory: arduino-checkout
      run: |
        git config user.name adafruitio
        git config user.email adafruitio@adafruit.com
        git checkout -b "$BRANCH"
        git status
        git add src
        git commit -m "Updating protobuf wrappers" || exit 0 # quit cleanly if nothing to commit
        git push --force origin "$BRANCH"
        if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[].number')" ]; then
          echo "PR for $BRANCH already open, branch updated"; exit 0
        fi
        gh pr create --repo "$REPO" --base main --head "$BRANCH" \
          --title ".proto file wrappers updated" \
          --body "Auto-generated by [GitHub Actions on Protobuf Repo](https://github.com/adafruit/Wippersnapper_Protobuf/blob/master/.github/workflows/protoc-wrapper-generation.yml) from adafruit/Wippersnapper_Protobuf@${{ github.sha }}."

  io-node:
    needs: generate
    if: github.event_name == 'push' || inputs.sync_io_node
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IO_BOT_PAT }}
      REPO: AdafruitInternalDev/io-node
      BRANCH: protobuf-update-${{ github.sha }}
    steps:
    - name: Check IO_BOT_PAT
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::IO_BOT_PAT secret is not set"; exit 1
        fi
        if ! gh api "repos/$REPO" --jq .full_name; then
          echo "::error::IO_BOT_PAT was rejected or can't see $REPO - it has probably expired, rotate it in the repo's Actions secrets"
          exit 1
        fi
    - name: Checkout io-node Repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.REPO }}
        token: ${{ secrets.IO_BOT_PAT }}
        path: js-checkout
        ref: main
    - uses: actions/download-artifact@v4
      with:
        name: javascript-wrapper
        path: ./js_out
    - name: Copy JS Files
      run: |
        rm -rf ./js-checkout/lib/wprsnpr/protobufs/wippersnapper/
        cp -r ./js_out/wippersnapper/ ./js-checkout/lib/wprsnpr/protobufs/wippersnapper/
        rm -rf ./js-checkout/lib/wprsnpr/protobufs/nanopb/
        mkdir ./js-checkout/lib/wprsnpr/protobufs/nanopb/
        mv ./js_out/protobuf-checkout/nanopb/generator/proto/nanopb_pb.js ./js-checkout/lib/wprsnpr/protobufs/nanopb/nanopb_pb.js
    - name: Open Node Pull Request
      working-directory: js-checkout
      run: |
        git config user.name adafruitio
        git config user.email adafruitio@adafruit.com
        git checkout -b "$BRANCH"
        git add lib/wprsnpr/protobufs/
        git commit -m "Updating protobuf wrappers" || exit 0 # quit cleanly if nothing to commit
        git push --force origin "$BRANCH"
        if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[].number')" ]; then
          echo "PR for $BRANCH already open, branch updated"; exit 0
        fi
        gh pr create --repo "$REPO" --base main --head "$BRANCH" \
          --title ".proto file wrappers updated" \
          --body "Auto-generated by [GitHub Actions on Protobuf Repo](https://github.com/adafruit/Wippersnapper_Protobuf/blob/master/.github/workflows/protoc-wrapper-generation.yml) from adafruit/Wippersnapper_Protobuf@${{ github.sha }}."
