name: Version Bump Check
# Any PR that changes a .proto or .options file (ignoring whitespace) must bump
# VERSION past the base branch's VERSION. Skips itself if the base has no VERSION.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: catches base-branch changes

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Self-test
        run: python3 bin/check-version-bump --self-test

      - name: Check VERSION was bumped
        run: |
          python3 bin/check-version-bump \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"
